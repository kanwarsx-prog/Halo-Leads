services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: halo_leads
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo
    ports:
      - "5432:5432"
    volumes:
      - halo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo -d halo_leads"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halo_postgres_data:
