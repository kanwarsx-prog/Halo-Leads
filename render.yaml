services:
  - type: web
    name: halo-lead-agent
    env: python
    buildCommand: "pip install ."
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
