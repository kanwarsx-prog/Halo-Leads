<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · See My Mind Education Intelligence</title>
    <link rel="stylesheet" href="/seemymind/static/styles.css?v=2.4">
    <script src="/seemymind/static/theme.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            background: var(--cream);
        }

        .login-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 16px -2px rgba(18, 59, 56, 0.08);
            text-align: center;
        }

        .login-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            margin-bottom: 0.75rem;
        }

        .login-title {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 0.25rem;
        }

        .login-sub {
            font-size: 0.82rem;
            color: var(--soft);
            margin-bottom: 1.75rem;
        }

        .error-alert {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--soft);
            margin-bottom: 0.35rem;
        }

        .form-group input {
            font-size: 16px;
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--line);
            border-radius: 7px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(29, 98, 93, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 7px;
            border: none;
            background: linear-gradient(135deg, #1d625d 0%, #123b38 100%);
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #123b38;
            transform: translateY(-1px);
        }
    </style>
    <!-- Browser Favicons -->
    <link rel="icon" type="image/svg+xml" href="/seemymind/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/seemymind/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/seemymind/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/seemymind/static/apple-touch-icon.png">
    <link rel="shortcut icon" href="/seemymind/static/favicon.ico">
</head>
<body>
    <div style="position: absolute; top: 1.25rem; right: 1.25rem;">
        <button id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-secondary theme-toggle-btn" title="Toggle theme (Dark / Light)" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
            <span class="theme-label">Dark</span>
        </button>
    </div>

    <div class="login-card">
        <img src="/seemymind/static/logos/seemymind-mark.png" alt="See My Mind" class="login-logo">
        <h1 class="login-title">See My Mind</h1>
        <p class="login-sub">Education Intelligence & Schools Outreach</p>

        {% if error %}
        <div class="error-alert">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" autofocus placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard &rarr;</button>
        </form>
    </div>

</body>
</html>
