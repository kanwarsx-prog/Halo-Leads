<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.title }} · Product request</title>
    <link rel="stylesheet" href="/seemymind/static/styles.css?v=3.0">
    <script src="/seemymind/static/theme.js"></script>
    <script src="/seemymind/static/agent.js?v=1.4" defer></script>
    <style>
      .detail-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin:2rem 0 1.5rem;flex-wrap:wrap}.eyebrow{color:var(--teal);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.detail-hero h1{margin:.35rem 0 0;max-width:850px}.detail-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:1.5rem;align-items:start}.detail-card{padding:1.35rem;border:1px solid var(--line);border-radius:14px;background:var(--card)}.detail-card h2{font-size:1.05rem;margin:0 0 1rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.detail-card label{display:block;font-size:.75rem;color:var(--soft);font-weight:700;margin:.75rem 0 .3rem}.detail-card input,.detail-card textarea,.detail-card select{width:100%;padding:.7rem;border:1px solid var(--line);border-radius:8px;background:var(--input-bg,var(--card));color:var(--ink);font:inherit}.detail-card textarea{min-height:150px;resize:vertical}.detail-card .wide{grid-column:1/-1}.score-note{font-size:.74rem;color:var(--soft);margin:.35rem 0 0}.detail-actions{display:flex;justify-content:space-between;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap}@media(max-width:800px){.detail-layout{grid-template-columns:1fr}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.detail-card .wide{grid-column:auto}}
    </style>
</head>
<body><div class="container">
<header><a href="/seemymind/product-requests" class="brand-title"><img src="/seemymind/static/logos/seemymind-mark.png" alt="See My Mind" class="brand-icon"><span class="brand-title-text smm-title">See My Mind</span><span class="brand-badge"><span class="live-dot"></span> Product work</span></a><nav><a href="/seemymind/product-requests" class="btn btn-secondary">All requests</a><a href="/seemymind/ui" class="btn btn-secondary">Dashboard</a><a href="/logout" class="btn btn-secondary">Log out</a></nav></header>
<section class="detail-hero"><div><div class="eyebrow">Product request</div><h1>{{ item.title }}</h1></div><a href="/seemymind/product-requests" class="btn btn-secondary">← Back to requests</a></section>
<form method="post" action="/seemymind/product-requests/{{ item.id }}"><div class="detail-layout"><section class="detail-card"><h2>Request details</h2><div class="form-grid"><div class="wide"><label>Title *</label><input name="title" required value="{{ item.title }}"></div><div class="wide"><label>What is needed? *</label><textarea name="description" required>{{ item.description }}</textarea></div><div><label>Source</label><select name="source">{% for source in sources %}<option value="{{ source }}" {% if item.source.value == source %}selected{% endif %}>{{ source|replace('_',' ')|title }}</option>{% endfor %}</select></div><div><label>Requester</label><input name="requester_name" value="{{ item.requester_name or '' }}"></div><div><label>Product area</label><input name="product_area" value="{{ item.product_area or '' }}"></div><div><label>Linked school</label><select name="school_id"><option value="">Not linked</option>{% for school in schools %}<option value="{{ school.id }}" {% if item.school_id == school.id %}selected{% endif %}>{{ school.name }}</option>{% endfor %}</select></div></div></section><aside class="detail-card"><h2>Planning</h2><label>Status</label><select name="status">{% for status in statuses %}<option value="{{ status }}" {% if item.status.value == status %}selected{% endif %}>{{ status|replace('_',' ')|title }}</option>{% endfor %}</select><label>Priority</label><select name="priority"><option {% if item.priority == 'High' %}selected{% endif %}>High</option><option {% if item.priority == 'Medium' %}selected{% endif %}>Medium</option><option {% if item.priority == 'Low' %}selected{% endif %}>Low</option></select><label>Owner</label><input name="owner" value="{{ item.owner or '' }}" placeholder="Person or team"><label>Target release</label><input name="target_release" value="{{ item.target_release or '' }}" placeholder="e.g. Q2 or Version 1.4"><label>Impact (1–5)</label><input type="number" min="1" max="5" name="impact_score" value="{{ item.impact_score }}"><label>Effort (1–5)</label><input type="number" min="1" max="5" name="effort_score" value="{{ item.effort_score }}"><label>Evidence (1–5)</label><input type="number" min="1" max="5" name="evidence_score" value="{{ item.evidence_score }}"><p class="score-note">Use these scores to support internal prioritisation.</p></aside><section class="detail-card"><h2>Notes</h2><textarea name="internal_notes" placeholder="Internal notes, decisions, or follow-up discussion">{{ item.internal_notes or '' }}</textarea><div class="detail-actions"><a href="/seemymind/product-requests" class="btn btn-secondary">Cancel</a><button type="submit" class="btn btn-primary">Save changes</button></div></section></div></form>
</div></body></html>
